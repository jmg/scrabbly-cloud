{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "Entrar" %} · Scrabbly{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>{% trans "Entrar" %}</h1>
  <form method="post">
    {% csrf_token %}
    <label>{% trans "Usuario" %}<input type="text" name="username" required></label>
    <label>{% trans "Contraseña" %}<input type="password" name="password" required></label>
    <button class="btn-primary" type="submit">{% trans "Entrar" %}</button>
  </form>
  <p class="muted">{% blocktrans %}¿No tenés cuenta?{% endblocktrans %} <a href="{% url 'register' %}">{% trans "Registrate" %}</a></p>
</div>
{% endblock %}
