{% extends "base.html" %}
{% block title %}Entrar · Scrabbly{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Entrar</h1>
  <form method="post">
    {% csrf_token %}
    <label>Usuario<input type="text" name="username" required></label>
    <label>Contraseña<input type="password" name="password" required></label>
    <button class="btn-primary" type="submit">Entrar</button>
  </form>
  <p class="muted">¿No tenés cuenta? <a href="{% url 'register' %}">Registrate</a></p>
</div>
{% endblock %}
